# ==============================================================================
# Оптимізований конфіг TLP для CoreBook XPro (Intel i5-10210U)
# ==============================================================================

# Увімкнення TLP
TLP_ENABLE=1
TLP_PERSISTENT_DEFAULT=0

# ------------------------------------------------------------------------------
# Процесор (Intel i5-10210U з intel_pstate)
# ------------------------------------------------------------------------------
# Режим регулятора частоти
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Intel Energy Performance Preference (EPP)
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance

# Обмеження робочих частот CPU від батареї (у %)
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=75

# Turbo Boost (1 = увімкнено, 0 = вимкнено для збереження заряду)
CPU_BOOST_ON_AC=0
CPU_BOOST_ON_BAT=0

# Динамічний буст Intel HWP
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# Вимикаємо NMI watchdog (зменшує кількість переривань процесора)
NMI_WATCHDOG=0

# ------------------------------------------------------------------------------
# Вбудована графіка Intel UHD
# ------------------------------------------------------------------------------
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=1100
INTEL_GPU_MAX_FREQ_ON_BAT=750
INTEL_GPU_BOOST_FREQ_ON_AC=1100
INTEL_GPU_BOOST_FREQ_ON_BAT=750

# ------------------------------------------------------------------------------
# Накопичувачі та шина PCIe
# ------------------------------------------------------------------------------
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2

SATA_LINKPWR_ON_AC=med_power_with_dipm
SATA_LINKPWR_ON_BAT=min_power

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto

# Енергозбереження PCIe шини (ASPM)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave

# Runtime Power Management
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ------------------------------------------------------------------------------
# Мережа та Бездротові модулі
# ------------------------------------------------------------------------------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Вимикаємо Wake-on-LAN
WOL_DISABLE=Y

# ------------------------------------------------------------------------------
# Аудіо та USB
# ------------------------------------------------------------------------------
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0
SOUND_POWER_SAVE_CONTROLLER=N

USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
